# Publishes a release when a tag v<version> is pushed whose version is retake's own: signed with the
# Developer ID in DEVELOPER_ID_P12 (its password in DEVELOPER_ID_P12_PASSWORD), notarized with the App
# Store Connect API key in NOTARY_KEY (NOTARY_KEY_ID, NOTARY_ISSUER_ID), and uploaded with its
# checksum to GitHub Releases, where `mise use github:justinseanmartin/Retake` finds it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select the Xcode .xcode-version names
        run: |
          WANTED="$(tr -d '[:space:]' < .xcode-version)"
          APP="$(ls -d /Applications/Xcode_"$WANTED"*.app | head -1)"
          [[ -n "$APP" ]] || { echo "::error::Xcode $WANTED isn't on this runner"; exit 1; }
          sudo xcode-select -s "$APP"

      - name: Import the Developer ID, and store the notary credentials
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          echo "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials retake-release --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          echo "RETAKE_RELEASE_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "RETAKE_NOTARY_PROFILE=retake-release" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        run: Scripts/release.sh "$RUNNER_TEMP/release"

      - name: Check the tag names this version
        run: |
          ARCHIVE="$(ls "$RUNNER_TEMP"/release/retake-*-macos-arm64.tar.gz)"
          [[ "$(basename "$ARCHIVE")" == "retake-${GITHUB_REF_NAME#v}-macos-arm64.tar.gz" ]] \
            || { echo "::error::$GITHUB_REF_NAME doesn't name the version retake reports ($(basename "$ARCHIVE"))"; exit 1; }

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Retake ${GITHUB_REF_NAME#v}" --generate-notes "$RUNNER_TEMP"/release/retake-*.tar.gz*
